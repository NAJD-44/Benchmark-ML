spring.application.name=benchd
# ===================================================================
# CONFIGURATION DE LA BASE DE DONNÉES (PostgreSQL)
# ===================================================================
# URL de la base de données, avec votre port 5433 et le nom de la BDD
spring.datasource.url=jdbc:postgresql://localhost:5433/benchmark_db
spring.datasource.username=postgres
# --- MODIFIEZ CETTE LIGNE AVEC VOTRE VRAI MOT DE PASSE ---
spring.datasource.password=postgres
# Pilote (généralement non nécessaire, mais bon à avoir)
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration du pool de connexions Hikari (demandé par le PDF)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10

# ===================================================================
# CONFIGURATION DE JPA / HIBERNATE
# ===================================================================
# Nous n'avons pas besoin de créer les tables, juste de valider qu'elles existent
spring.jpa.hibernate.ddl-auto=validate
# Afficher le SQL dans la console (bien pour le débogage)
spring.jpa.show-sql=true
# [cite_start]Désactiver le cache L2 (requis par le PDF) [cite: 84]
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# ===================================================================
# CONFIGURATION DE SPRING DATA REST (Variante D)
# ===================================================================
# Définit l'URL de base de l'API (pour correspondre à /api comme la Variante A)
spring.data.rest.base-path=/api
# Nous n'avons pas besoin que Spring Data REST crée des endpoints pour les ID
spring.data.rest.return-body-on-create=true
spring.data.rest.return-body-on-update=true

# ===================================================================
# CONFIGURATION DU MONITORING (Actuator & Prometheus)
# ===================================================================
# Change le port du serveur Actuator pour qu'il soit sur 8081 (comme la Variante A)
management.server.port=8081
# Exposer l'endpoint "prometheus" (pour que Prometheus puisse lire les métriques)
management.endpoints.web.exposure.include=prometheus
# Ajouter les métriques Hikari (pool de BDD) à l'export Prometheus
management.metrics.enable.hikaricp=true